<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Revelado</title>

  <!-- Esta línea trae la librería de Supabase, lista para usar como "supabase.createClient(...)" -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --darkroom:#150f0a; --darkroom-2:#221a12; --darkroom-3:#2c2117;
      --paper:#f3e9d7; --paper-dim:#c2b498; --paper-faint:#8a7d65;
      --amber:#e8823c; --amber-bright:#ffa858; --fixer:#4fa69c;
      --line:rgba(243,233,215,0.14); --line-strong:rgba(243,233,215,0.26);
    }
    *,*::before,*::after{box-sizing:border-box;}
    body{
      margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:var(--darkroom); color:var(--paper); font-family:system-ui, sans-serif; text-align:center; padding:24px;
    }
    h1{font-size:2rem; margin:0 0 6px;}
    p{color:var(--paper-dim); margin:0 0 28px; max-width:34ch;}

    /* --- Pantalla de carga / error (antes de saber qué evento es) --- */
    .state-msg{color:var(--paper-dim); font-size:14px; max-width:30ch; line-height:1.6;}
    .state-msg.error{color:#d9694f;}

    .frame-card{margin-bottom:22px;}
    .frame-card.polaroid-card{
      background:#ffffff; padding:14px 14px 46px; border-radius:4px;
      box-shadow:0 14px 30px -16px rgba(0,0,0,0.55);
    }
    .frame{
      width:min(280px, 78vw); aspect-ratio:1/1; background:#1b1512; border-radius:12px;
      display:flex; align-items:center; justify-content:center; overflow:hidden;
      border:1px solid var(--line-strong); position:relative;
    }
    .frame-card.polaroid-card .frame{border-radius:2px; border:none;}
    .frame img{width:100%; height:100%; object-fit:cover; display:block;}
    .frame .placeholder{color:var(--paper-faint); font-size:13px; padding:16px;}

    .filter-vintage{ filter: sepia(0.18) saturate(0.8) contrast(0.78) brightness(1.16) hue-rotate(-4deg); }
    .filter-bw{ filter: grayscale(1) contrast(1.32) brightness(0.94); }
    .filter-polaroid{ filter: saturate(0.85) contrast(0.92) brightness(1.06) sepia(0.08); }

    .frame.vintage-glow::after{
      content:""; position:absolute; inset:0; pointer-events:none;
      background:radial-gradient(circle at 72% 18%, rgba(255,221,163,0.42), transparent 55%);
      mix-blend-mode:screen;
    }

    button, textarea, input{font-family:inherit; cursor:pointer;}
    .shutter-btn{
      width:84px; height:84px; border-radius:50%;
      background:radial-gradient(circle at 35% 30%, var(--amber-bright), var(--amber) 65%);
      border:4px solid var(--darkroom-2); display:flex; align-items:center; justify-content:center;
    }
    .shutter-btn svg{width:30px; height:30px;}
    .shutter-btn:disabled{opacity:0.5;}
    input[type="file"]{display:none;}

    /* --- Panel de detalles (nombre + mensaje) antes de confirmar la subida --- */
    .details-panel{
      width:min(320px, 84vw); text-align:left; margin-bottom:8px;
      background:var(--darkroom-2); border:1px solid var(--line); border-radius:14px; padding:16px;
    }
    .details-panel label{display:block; font-size:11.5px; color:var(--paper-dim); margin-bottom:4px; font-weight:600;}
    .details-panel .field{margin-bottom:12px;}
    .details-panel input[type="text"], .details-panel textarea{
      width:100%; font-size:14px; padding:10px 11px; border-radius:8px; cursor:text;
      border:1px solid var(--line-strong); background:var(--darkroom); color:var(--paper); resize:none;
    }
    .details-panel input:focus, .details-panel textarea:focus{outline:2px solid var(--fixer); outline-offset:1px;}
    .details-actions{display:flex; gap:10px;}
    .btn-secondary, .btn-upload{
      flex:1; font-size:13.5px; font-weight:600; padding:11px 10px; border-radius:8px; border:none;
    }
    .btn-secondary{background:transparent; border:1px solid var(--line-strong); color:var(--paper);}
    .btn-upload{background:var(--amber); color:var(--darkroom);}
    .btn-upload:hover{background:var(--amber-bright);}
    .btn-secondary:disabled, .btn-upload:disabled{opacity:0.6; cursor:default;}

    .status{margin-top:18px; font-size:13.5px; color:var(--paper-dim); min-height:20px;}
    .status.ok{color:var(--fixer);}
    .status.err{color:#d9694f;}

    /* Asegura que "hidden" siempre oculte, incluso en elementos que también
       tienen su propio "display" (como flex) -- sin esto, el navegador
       puede ignorar "hidden" y dejar el elemento visible por error. */
    [hidden]{ display:none !important; }
  </style>
</head>
<body>

  <!-- Mientras se identifica el evento del QR, o si el link no es válido -->
  <div id="stateScreen">
    <h1>Revelado 📸</h1>
    <p class="state-msg" id="stateMsg">Cargando tu evento…</p>
  </div>

  <!-- La cámara solo aparece una vez que sabemos que el evento existe y está activo -->
  <div id="cameraUI" hidden>
    <h1>Revelado 📸</h1>
    <p>Toca el obturador y tu foto entra directo al álbum.</p>

    <div class="frame-card" id="frameCard">
      <div class="frame" id="frame"><div class="placeholder">Aquí aparecerá tu foto</div></div>
    </div>

    <div class="details-panel" id="detailsPanel" hidden>
      <div class="field">
        <label for="guestName">Tu nombre (opcional)</label>
        <input type="text" id="guestName" placeholder="¿Cómo te llamas?" maxlength="60">
      </div>
      <div class="field">
        <label for="caption">Mensaje (opcional)</label>
        <textarea id="caption" placeholder="Escribe algo lindo…" maxlength="200" rows="2"></textarea>
      </div>
      <div class="details-actions">
        <button type="button" class="btn-secondary" id="retakeBtn">Tomar otra</button>
        <button type="button" class="btn-upload" id="confirmUploadBtn">Subir foto</button>
      </div>
    </div>

    <button class="shutter-btn" id="shutterBtn" aria-label="Tomar foto">
      <svg viewBox="0 0 24 24" fill="none" stroke="#150f0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"></path><circle cx="12" cy="13" r="3.4"></circle></svg>
    </button>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">

    <div class="status" id="status"></div>
  </div>

  <script>
    // --- 1) Conexión con Supabase -------------------------------------
    const SUPABASE_URL = 'https://qhwxtgzqnztshmudabho.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFod3h0Z3pxbnp0c2htdWRhYmhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3OTI5NzQsImV4cCI6MjEwMzM2ODk3NH0.ufpYauUWbbbJrAPOTY3zA6vQ9DfsYBEFXVsZrtPV2YU';

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- 2) Elementos de la página --------------------------------------
    const stateScreen = document.getElementById('stateScreen');
    const stateMsg = document.getElementById('stateMsg');
    const cameraUI = document.getElementById('cameraUI');
    const shutterBtn = document.getElementById('shutterBtn');
    const cameraInput = document.getElementById('cameraInput');
    const frame = document.getElementById('frame');
    const statusEl = document.getElementById('status');
    const detailsPanel = document.getElementById('detailsPanel');
    const guestNameInput = document.getElementById('guestName');
    const captionInput = document.getElementById('caption');
    const retakeBtn = document.getElementById('retakeBtn');
    const confirmUploadBtn = document.getElementById('confirmUploadBtn');

    function setStatus(text, kind) {
      statusEl.textContent = text || '';
      statusEl.className = 'status' + (kind ? ' ' + kind : '');
    }

    function showError(msg) {
      stateMsg.textContent = msg;
      stateMsg.classList.add('error');
      stateScreen.hidden = false;
      cameraUI.hidden = true;
    }

    // --- 3) Identificar el evento a partir del link (?e=slug-del-evento) ---
    let currentEvent = null; // { id, filterClass }

    async function loadEvent() {
      const slug = new URLSearchParams(window.location.search).get('e');
      if (!slug) {
        showError('Este link no tiene un evento válido. Escanea el código QR de tu evento.');
        return;
      }

      const { data, error } = await db.from('events').select('id, filter, status').eq('slug', slug).single();
      if (error || !data) {
        showError('No encontramos ese evento. Pide el código QR correcto a tu organizador.');
        return;
      }
      if (data.status !== 'activo') {
        showError('Este evento todavía no está activo.');
        return;
      }

      currentEvent = { id: data.id, filterClass: 'filter-' + (data.filter || 'vintage') };

      document.getElementById('frameCard').classList.toggle('polaroid-card', currentEvent.filterClass === 'filter-polaroid');
      document.getElementById('frame').classList.toggle('vintage-glow', currentEvent.filterClass === 'filter-vintage');

      // si ya puso su nombre en una foto anterior de esta visita, lo recordamos
      try {
        const savedName = localStorage.getItem('revelado_guest_name');
        if (savedName) guestNameInput.value = savedName;
      } catch (e) { /* si el navegador bloquea localStorage, no pasa nada, solo no se recuerda */ }

      stateScreen.hidden = true;
      cameraUI.hidden = false;
    }

    // --- 4) Achicar la foto antes de subirla ---------------------------
    function compress(file) {
      return new Promise((resolve, reject) => {
        const maxDim = 1200;
        function draw(source, w, h) {
          const scale = Math.min(1, maxDim / Math.max(w, h));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(w * scale);
          canvas.height = Math.round(h * scale);
          canvas.getContext('2d').drawImage(source, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('no blob')), 'image/jpeg', 0.7);
        }
        function fallback() {
          const img = new Image();
          const url = URL.createObjectURL(file);
          img.onload = () => { draw(img, img.naturalWidth, img.naturalHeight); URL.revokeObjectURL(url); };
          img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
          img.src = url;
        }
        if (window.createImageBitmap) {
          createImageBitmap(file, { imageOrientation: 'from-image' }).then(bmp => draw(bmp, bmp.width, bmp.height)).catch(fallback);
        } else {
          fallback();
        }
      });
    }

    // --- 5) El flujo: foto -> vista previa + nombre/mensaje -> confirmar -> subir
    let pendingBlob = null;

    shutterBtn.addEventListener('click', () => cameraInput.click());

    cameraInput.addEventListener('change', async () => {
      const file = cameraInput.files[0];
      if (!file || !currentEvent) return;

      setStatus('Revelando…');
      shutterBtn.disabled = true;

      try {
        const blob = await compress(file);
        pendingBlob = blob;

        frame.innerHTML = '';
        const img = document.createElement('img');
        img.className = currentEvent.filterClass;
        img.src = URL.createObjectURL(blob);
        frame.appendChild(img);

        setStatus('');
        shutterBtn.hidden = true;
        detailsPanel.hidden = false;
      } catch (err) {
        console.error(err);
        setStatus('No se pudo procesar la foto: ' + (err.message || 'intenta de nuevo'), 'err');
        shutterBtn.disabled = false;
      } finally {
        cameraInput.value = '';
      }
    });

    retakeBtn.addEventListener('click', () => {
      pendingBlob = null;
      detailsPanel.hidden = true;
      shutterBtn.hidden = false;
      shutterBtn.disabled = false;
      frame.innerHTML = '<div class="placeholder">Aquí aparecerá tu foto</div>';
      cameraInput.click();
    });

    confirmUploadBtn.addEventListener('click', async () => {
      if (!pendingBlob || !currentEvent) return;

      const guestName = guestNameInput.value.trim();
      const caption = captionInput.value.trim();

      confirmUploadBtn.disabled = true;
      retakeBtn.disabled = true;
      confirmUploadBtn.textContent = 'Subiendo…';
      setStatus('Revelando…');

      try {
        const path = currentEvent.id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';

        const { error: uploadError } = await db.storage.from('fotos').upload(path, pendingBlob, { contentType: 'image/jpeg' });
        if (uploadError) throw uploadError;

        const { data: pub } = db.storage.from('fotos').getPublicUrl(path);

        const { error: insertError } = await db.from('photos').insert({
          event_id: currentEvent.id,
          photo_url: pub.publicUrl,
          guest_name: guestName || null,
          caption: caption || null
        });
        if (insertError) throw insertError;

        try { if (guestName) localStorage.setItem('revelado_guest_name', guestName); } catch (e) { /* ignorar */ }

        setStatus('¡Lista! Ya está en el álbum.', 'ok');
        pendingBlob = null;
        detailsPanel.hidden = true;
        shutterBtn.hidden = false;
        captionInput.value = '';
      } catch (err) {
        console.error(err);
        setStatus('No se pudo subir: ' + (err.message || 'intenta de nuevo'), 'err');
      } finally {
        confirmUploadBtn.disabled = false;
        retakeBtn.disabled = false;
        confirmUploadBtn.textContent = 'Subir foto';
        shutterBtn.disabled = false;
      }
    });

    loadEvent();
  </script>
</body>
</html>
