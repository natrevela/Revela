<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revelado</title>

<!-- Esta línea trae la librería de Supabase, lista para usar como "supabase.createClient(...)" -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
--darkroom:#ffffff; --darkroom-2:#f7f0e4; --darkroom-3:#f0e6d4;
--paper:#2a1d14; --paper-dim:#6b5847; --paper-faint:#8a7460;
--amber:#c97c56; --amber-bright:#da9873; --fixer:#7e9172;
--line:rgba(42,29,20,0.12); --line-strong:rgba(42,29,20,0.22);
}
*,*::before,*::after{box-sizing:border-box;}
body{
margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
background:var(--darkroom); color:var(--paper); font-family:system-ui, sans-serif; text-align:center; padding:24px;
}
h1{font-size:2rem; margin:0 0 14px;}
/* Sin "auto" un párrafo con max-width se pega a la izquierda cuando la
   columna es ancha. */
p{color:var(--paper-dim); margin:0 auto 20px; max-width:34ch;}

/* La cámara vive en una columna de ancho fijo y centrada. Antes se estiraba
   con el contenido (la cuadrícula de fotos la hacía enorme) y todo lo demás
   quedaba desalineado en pantallas grandes. */
#cameraUI{width:100%; max-width:360px; margin:0 auto;}

/* --- Pantalla de carga / error (antes de saber qué evento es) --- */
.state-msg{color:var(--paper-dim); font-size:14px; max-width:30ch; line-height:1.6;}
.state-msg.error{color:#b0523a;}

/* --- Selector de modo: foto o mensaje de voz --- */
.mode-switch{display:flex; gap:8px; width:min(320px, 84vw); margin:0 auto 20px;}
.mode-btn{
flex:1; font-size:12.5px; font-weight:600; padding:10px 6px; border-radius:999px;
border:1px solid var(--line-strong); background:transparent; color:var(--paper-dim);
}
.mode-btn.active{background:var(--amber); border-color:var(--amber); color:var(--paper);}

/* El marco mide menos que el resto de la columna (280 contra 320), así que sin
   esto queda recorrido a la izquierda en vez de centrado. */
.frame-card{width:fit-content; margin:0 auto 22px;}
.frame-card.polaroid-card{
background:#ffffff; padding:14px 14px 46px; border-radius:4px;
box-shadow:0 14px 30px -16px rgba(42,29,20,0.22);
}
.frame{
width:min(280px, 78vw); aspect-ratio:1/1; background:#1b1512; border-radius:12px;
display:flex; align-items:center; justify-content:center; overflow:hidden;
border:1px solid var(--line-strong); position:relative;
}
.frame-card.polaroid-card .frame{border-radius:2px; border:none;}
.frame img{width:100%; height:100%; object-fit:cover; display:block;}
.frame .placeholder{color:var(--paper-faint); font-size:13px; padding:16px;}

.filter-vintage{ filter: sepia(0.18) saturate(0.8) contrast(0.78) brightness(1.16) hue-rotate(-4deg); }
.filter-bw{ filter: grayscale(1) contrast(1.32) brightness(0.94); }
.filter-polaroid{ filter: saturate(0.85) contrast(0.92) brightness(1.06) sepia(0.08); }

.frame.vintage-glow::after{
content:""; position:absolute; inset:0; pointer-events:none;
background:radial-gradient(circle at 72% 18%, rgba(255,221,163,0.42), transparent 55%);
mix-blend-mode:screen;
}

button, textarea, input{font-family:inherit; cursor:pointer;}
.shutter-btn, .record-btn{
width:84px; height:84px; border-radius:50%;
background:radial-gradient(circle at 35% 30%, var(--amber-bright), var(--amber) 65%);
border:4px solid var(--darkroom-2); display:flex; align-items:center; justify-content:center;
margin:0 auto;
}
.shutter-btn svg, .record-btn svg{width:30px; height:30px;}
.shutter-btn:disabled{opacity:0.5;}
input[type="file"]{display:none;}

.record-btn.recording{
background:radial-gradient(circle at 35% 30%, #e08268, #b0523a 65%);
animation:pulse-rec 1.1s ease-in-out infinite;
}
@keyframes pulse-rec{
0%,100%{box-shadow:0 0 0 0 rgba(176,82,58,0.5);}
50%{box-shadow:0 0 0 10px rgba(176,82,58,0);}
}
.record-timer{margin-top:14px; font-size:14px; color:var(--paper-dim);}

.voice-preview{width:min(320px, 84vw); margin:18px auto 0; text-align:left;}
.voice-preview audio{width:100%; margin-bottom:14px;}

/* --- Panel de detalles (nombre + mensaje) antes de confirmar la subida --- */
.details-panel{
width:min(320px, 84vw); text-align:left; margin:0 auto 8px;
background:var(--darkroom-2); border:1px solid var(--line); border-radius:14px; padding:16px;
}
.details-panel label{display:block; font-size:11.5px; color:var(--paper-dim); margin-bottom:4px; font-weight:600;}
.details-panel .field{margin-bottom:12px;}
.details-panel input[type="text"], .details-panel textarea{
width:100%; font-size:14px; padding:10px 11px; border-radius:8px; cursor:text;
border:1px solid var(--line-strong); background:var(--darkroom); color:var(--paper); resize:none;
}
.details-panel input:focus, .details-panel textarea:focus{outline:2px solid var(--fixer); outline-offset:1px;}
.details-actions{display:flex; gap:10px;}
.btn-secondary, .btn-upload{
flex:1; font-size:13.5px; font-weight:600; padding:11px 10px; border-radius:8px; border:none;
}
.btn-secondary{background:transparent; border:1px solid var(--line-strong); color:var(--paper);}
.btn-upload{background:var(--amber); color:var(--paper);}
.btn-upload:hover{background:var(--amber-bright);}
.btn-secondary:disabled, .btn-upload:disabled{opacity:0.6; cursor:default;}

.shots-left{
margin-top:14px; font-size:12.5px; letter-spacing:0.04em; text-transform:uppercase;
font-weight:600; color:var(--paper-dim);
}
.shots-left.empty{color:#b0523a;}

/* El rollo revelado que se le muestra al invitado al terminar la prueba */
.roll-review{margin-top:8px;}
.roll-review h2{font-size:1.15rem; margin:0 0 6px;}
.roll-review p{font-size:13px; color:var(--paper-dim); margin:0 0 16px;}
.roll-grid{
display:grid; grid-template-columns:repeat(auto-fit, minmax(88px, 1fr)); gap:10px; margin-bottom:20px;
}
.roll-grid .roll-shot{
aspect-ratio:1; overflow:hidden; border-radius:8px; background:var(--darkroom-2);
border:1px solid rgba(42,29,20,0.12); padding:0; cursor:zoom-in;
}
.roll-grid .roll-shot:focus-visible{outline:2px solid var(--fixer); outline-offset:2px;}
.roll-grid .roll-shot.polaroid-shot{
background:#fff; border-radius:3px; padding:5px 5px 14px;
box-shadow:0 4px 12px -6px rgba(42,29,20,0.3);
}
.roll-grid img{width:100%; height:100%; object-fit:cover; display:block;}
.roll-cta{
display:inline-flex; align-items:center; justify-content:center;
background:var(--amber); color:var(--paper); text-decoration:none;
font-weight:600; font-size:14px; border-radius:999px; padding:12px 24px;
}
/* Visor: al tocar una foto del rollo se abre grande, con flechas */
.lightbox{
position:fixed; inset:0; z-index:50; background:rgba(20,14,10,0.94);
display:flex; align-items:center; justify-content:center; padding:20px;
}
.lb-stage{
max-width:min(720px, 88vw); max-height:78vh; display:flex; align-items:center; justify-content:center;
}
.lb-stage img{max-width:100%; max-height:78vh; width:auto; height:auto; display:block; border-radius:6px;}
.lb-stage.lb-polaroid{background:#fff; padding:16px 16px 52px; border-radius:4px;}
.lb-stage.lb-polaroid img{border-radius:2px; max-height:68vh;}
.lb-btn{
position:absolute; background:rgba(255,255,255,0.12); color:#fff; border:none;
width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center;
font-size:26px; line-height:1;
}
.lb-btn:hover{background:rgba(255,255,255,0.24);}
.lb-btn:focus-visible{outline:2px solid #fff; outline-offset:2px;}
.lb-prev{left:14px; top:50%; transform:translateY(-50%);}
.lb-next{right:14px; top:50%; transform:translateY(-50%);}
.lb-close{top:14px; right:14px; font-size:20px;}
.lb-count{
position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
color:rgba(255,255,255,0.72); font-size:12.5px; letter-spacing:0.06em;
}
.status{margin-top:18px; font-size:13.5px; color:var(--paper-dim); min-height:20px;}
.status.ok{color:var(--fixer);}
.status.err{color:#b0523a;}

/* Asegura que "hidden" siempre oculte, incluso en elementos que también
tienen su propio "display" (como flex) -- sin esto, el navegador
puede ignorar "hidden" y dejar el elemento visible por error. */
[hidden]{ display:none !important; }
</style>
</head>
<body>

<!-- Mientras se identifica el evento del QR, o si el link no es válido -->
<div id="stateScreen">
<h1><svg width="34" height="30" viewBox="0 0 32 28" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align:-9px; margin-right:9px; color:var(--amber);"><rect x="13" y="2" width="7" height="4" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="6" width="26" height="18" rx="3" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="16" r="7" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="16" r="3.6" stroke="currentColor" stroke-width="1.4"/><circle cx="24" cy="10.5" r="1.3" fill="currentColor"/><rect x="6" y="3.2" width="4" height="2.2" rx="1" fill="currentColor"/></svg>Revelado</h1>
<p class="state-msg" id="stateMsg">Cargando tu evento…</p>
</div>

<!-- La cámara solo aparece una vez que sabemos que el evento existe y está activo -->
<div id="cameraUI" hidden>
<h1><svg width="34" height="30" viewBox="0 0 32 28" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align:-9px; margin-right:9px; color:var(--amber);"><rect x="13" y="2" width="7" height="4" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="6" width="26" height="18" rx="3" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="16" r="7" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="16" r="3.6" stroke="currentColor" stroke-width="1.4"/><circle cx="24" cy="10.5" r="1.3" fill="currentColor"/><rect x="6" y="3.2" width="4" height="2.2" rx="1" fill="currentColor"/></svg>Revelado</h1>

<div class="mode-switch" id="modeSwitch">
<button type="button" class="mode-btn active" id="modePhotoBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:4px;"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"></path><circle cx="12" cy="13" r="3.4"></circle></svg>Foto</button>
<button type="button" class="mode-btn" id="modeVoiceBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:4px;"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"></path><path d="M19 11a7 7 0 0 1-14 0"></path><line x1="12" y1="18" x2="12" y2="22"></line></svg>Mensaje de voz</button>
</div>

<!-- ===== Modo foto ===== -->
<div id="photoMode">
<p id="photoHint">Toca el obturador y tu foto entra directo al álbum.</p>

<div class="frame-card" id="frameCard">
<div class="frame" id="frame"><div class="placeholder">Aquí aparecerá tu foto</div></div>
</div>

<div class="details-panel" id="detailsPanel" hidden>
<div class="field">
<label for="guestName">Tu nombre (opcional)</label>
<input type="text" id="guestName" placeholder="¿Cómo te llamas?" maxlength="60">
</div>
<div class="field">
<label for="caption">Mensaje (opcional)</label>
<textarea id="caption" placeholder="Escribe algo lindo…" maxlength="200" rows="2"></textarea>
</div>
<div class="details-actions">
<button type="button" class="btn-upload" id="confirmUploadBtn">Subir foto</button>
</div>
</div>

<button class="shutter-btn" id="shutterBtn" aria-label="Tomar foto">
<svg viewBox="0 0 24 24" fill="none" stroke="#2a1d14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"></path><circle cx="12" cy="13" r="3.4"></circle></svg>
</button>
<div class="shots-left" id="shotsLeft" hidden></div>

<!-- El rollo revelado: al terminarse la prueba, le enseñamos sus fotos -->
<div class="roll-review" id="rollReview" hidden>
<h2 id="rollTitle">Tu rollo revelado</h2>
<div class="roll-grid" id="rollGrid"></div>
<a class="roll-cta" href="/#paquetes">Ver paquetes para mi evento</a>
</div>
<input type="file" id="cameraInput" accept="image/*" capture="environment">
</div>

<!-- ===== Modo mensaje de voz ===== -->
<div id="voiceMode" hidden>
<p>Deja un mensaje de voz de hasta 15 segundos para los festejados.</p>

<button class="record-btn" id="recordBtn" aria-label="Grabar mensaje de voz">
<svg viewBox="0 0 24 24" fill="none" stroke="#2a1d14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"></path><path d="M19 11a7 7 0 0 1-14 0"></path><line x1="12" y1="18" x2="12" y2="22"></line></svg>
</button>
<div class="record-timer" id="recordTimer" hidden>0:00 / 0:15</div>

<div class="voice-preview" id="voicePreview" hidden>
<audio id="voiceAudio" controls></audio>
<div class="field">
<label for="voiceGuestName">Tu nombre (opcional)</label>
<input type="text" id="voiceGuestName" placeholder="¿Cómo te llamas?" maxlength="60">
</div>
<div class="details-actions">
<button type="button" class="btn-secondary" id="voiceRetakeBtn">Grabar de nuevo</button>
<button type="button" class="btn-upload" id="voiceSendBtn">Enviar mensaje</button>
</div>
</div>
</div>

<div class="status" id="status"></div>
<!-- Visor de fotos del rollo -->
<div class="lightbox" id="lightbox" hidden>
<button type="button" class="lb-btn lb-close" id="lbClose" aria-label="Cerrar">&#10005;</button>
<button type="button" class="lb-btn lb-prev" id="lbPrev" aria-label="Foto anterior">&#8249;</button>
<div class="lb-stage" id="lbStage"></div>
<button type="button" class="lb-btn lb-next" id="lbNext" aria-label="Foto siguiente">&#8250;</button>
<div class="lb-count" id="lbCount"></div>
</div>

</div>

<script>
// --- 1) Conexión con Supabase -------------------------------------
const SUPABASE_URL = 'https://qhwxtgzqnztshmudabho.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFod3h0Z3pxbnp0c2htdWRhYmhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3OTI5NzQsImV4cCI6MjEwMzM2ODk3NH0.ufpYauUWbbbJrAPOTY3zA6vQ9DfsYBEFXVsZrtPV2YU';

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// --- 2) Elementos de la página --------------------------------------
const stateScreen = document.getElementById('stateScreen');
const stateMsg = document.getElementById('stateMsg');
const cameraUI = document.getElementById('cameraUI');
const shutterBtn = document.getElementById('shutterBtn');
const cameraInput = document.getElementById('cameraInput');
const frame = document.getElementById('frame');
const statusEl = document.getElementById('status');
const detailsPanel = document.getElementById('detailsPanel');
const guestNameInput = document.getElementById('guestName');
const captionInput = document.getElementById('caption');
const frameCard = document.getElementById('frameCard');
const photoHint = document.getElementById('photoHint');
const rollReview = document.getElementById('rollReview');
const lightbox = document.getElementById('lightbox');
const lbStage = document.getElementById('lbStage');
const lbCount = document.getElementById('lbCount');
const lbPrev = document.getElementById('lbPrev');
const lbNext = document.getElementById('lbNext');
const rollGrid = document.getElementById('rollGrid');
const rollTitle = document.getElementById('rollTitle');
// Las fotos que tomó en esta visita, para revelárselas cuando se acabe el rollo.
const rollPhotos = [];
const confirmUploadBtn = document.getElementById('confirmUploadBtn');

const modePhotoBtn = document.getElementById('modePhotoBtn');
const modeVoiceBtn = document.getElementById('modeVoiceBtn');
const photoMode = document.getElementById('photoMode');
const voiceMode = document.getElementById('voiceMode');
const recordBtn = document.getElementById('recordBtn');
const recordTimer = document.getElementById('recordTimer');
const voicePreview = document.getElementById('voicePreview');
const voiceAudio = document.getElementById('voiceAudio');
const voiceGuestName = document.getElementById('voiceGuestName');
const voiceRetakeBtn = document.getElementById('voiceRetakeBtn');
const voiceSendBtn = document.getElementById('voiceSendBtn');

function setStatus(text, kind) {
statusEl.textContent = text || '';
statusEl.className = 'status' + (kind ? ' ' + kind : '');
}

// Junta todo el detalle que Supabase mande sobre un error (a veces el
// mensaje principal no alcanza a explicar qué pasó) -- solo para
// diagnosticar, no cambia el comportamiento normal de la página.
function describeError(err) {
const parts = [err && err.message, err && err.details, err && err.hint, err && err.code]
.filter(Boolean);
return parts.length ? parts.join(' | ') : 'intenta de nuevo';
}

function showError(msg) {
stateMsg.textContent = msg;
stateMsg.classList.add('error');
stateScreen.hidden = false;
cameraUI.hidden = true;
}

// --- 2.5) El "rollo": cada invitado trae un número fijo de fotos ------
// Es la gracia de la cámara desechable: cuando sabes cuántas traes, piensas
// cada foto. El conteo se guarda en el propio celular del invitado, por
// evento, así que si alguien borra los datos de su navegador puede volver a
// empezar — no es un candado, es la regla del juego.
// En un evento de verdad son 25 fotos; la demo de la página trae solo 5,
// suficientes para probar cómo se siente sin regalar el evento completo.
const PHOTO_LIMIT = 25;
const DEMO_SLUG = 'demo';
const DEMO_PHOTO_LIMIT = 5;
const shotsLeftEl = document.getElementById('shotsLeft');

function shotsKey(eventId) { return 'revelado_shots_' + eventId; }

// Cuántas fotos trae el rollo de este evento (la demo trae menos).
function photoLimitFor(slug) {
return slug === DEMO_SLUG ? DEMO_PHOTO_LIMIT : PHOTO_LIMIT;
}

function shotsTaken(eventId) {
try {
const raw = localStorage.getItem(shotsKey(eventId));
const n = parseInt(raw, 10);
return Number.isFinite(n) && n > 0 ? n : 0;
} catch (e) { return 0; }
}

function shotsRemaining(eventId) {
const limit = currentEvent && currentEvent.photoLimit ? currentEvent.photoLimit : PHOTO_LIMIT;
return Math.max(0, limit - shotsTaken(eventId));
}

function registerShot(eventId) {
try { localStorage.setItem(shotsKey(eventId), String(shotsTaken(eventId) + 1)); } catch (e) { /* ignorar */ }
}

// Al acabarse el rollo le enseñamos sus fotos, ya con el formato del evento,
// que es justo lo que queremos que aprecie: no son fotos de celular, son
// fotos reveladas. Solo se muestran las de esta visita (las que trae en
// memoria); si vuelve más tarde con el rollo ya gastado, no hay nada que
// revelar y simplemente no aparece la sección.
function revealRoll() {
if (!rollPhotos.length) { rollReview.hidden = true; return; }

// Con el rollo ya revelado, el marco vacío y la instrucción de disparar sobran.
frameCard.hidden = true;
photoHint.hidden = true;

rollTitle.textContent = currentEvent.isDemo ? 'Así quedaron tus fotos' : 'Tu rollo revelado';
// El mensaje ya lo dice aquí arriba; no hace falta repetirlo hasta abajo.
if (currentEvent.isDemo) setStatus('');

rollGrid.innerHTML = '';
const esPolaroid = currentEvent.filterClass === 'filter-polaroid';
rollPhotos.forEach((src, i) => {
const marco = document.createElement('button');
marco.type = 'button';
marco.className = 'roll-shot' + (esPolaroid ? ' polaroid-shot' : '');
marco.setAttribute('aria-label', 'Ver la foto ' + (i + 1) + ' en grande');
marco.addEventListener('click', () => lbOpen(i));
const img = document.createElement('img');
img.className = currentEvent.filterClass;
img.alt = 'Foto que tomaste';
img.src = src;
marco.appendChild(img);
rollGrid.appendChild(marco);
});
rollReview.hidden = false;
}

// --- El visor: ver una foto en grande y moverse con las flechas -------
let lbIndex = 0;

function lbShow(i) {
if (!rollPhotos.length) return;
// Se le da la vuelta al rollo: de la última pasa a la primera y al revés.
lbIndex = (i + rollPhotos.length) % rollPhotos.length;

const esPolaroid = currentEvent && currentEvent.filterClass === 'filter-polaroid';
lbStage.classList.toggle('lb-polaroid', esPolaroid);
lbStage.innerHTML = '';
const img = document.createElement('img');
img.className = currentEvent ? currentEvent.filterClass : '';
img.alt = 'Foto ' + (lbIndex + 1) + ' de ' + rollPhotos.length;
img.src = rollPhotos[lbIndex];
lbStage.appendChild(img);

lbCount.textContent = (lbIndex + 1) + ' / ' + rollPhotos.length;
// Con una sola foto las flechas no tienen a dónde llevar.
const varias = rollPhotos.length > 1;
lbPrev.hidden = !varias;
lbNext.hidden = !varias;
lbCount.hidden = !varias;
}

function lbOpen(i) {
lbShow(i);
lightbox.hidden = false;
}

function lbClose() {
lightbox.hidden = true;
lbStage.innerHTML = '';
}

lbPrev.addEventListener('click', () => lbShow(lbIndex - 1));
lbNext.addEventListener('click', () => lbShow(lbIndex + 1));
document.getElementById('lbClose').addEventListener('click', lbClose);
// Tocar el fondo (fuera de la foto) también cierra.
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lbClose(); });
document.addEventListener('keydown', (e) => {
if (lightbox.hidden) return;
if (e.key === 'Escape') lbClose();
else if (e.key === 'ArrowLeft') lbShow(lbIndex - 1);
else if (e.key === 'ArrowRight') lbShow(lbIndex + 1);
});

// Pinta el contador y apaga el obturador cuando ya se acabó el rollo.
function refreshShotsUI() {
if (!currentEvent) return;
const left = shotsRemaining(currentEvent.id);
shotsLeftEl.hidden = false;
shotsLeftEl.classList.toggle('empty', left === 0);
if (left === 0) {
shutterBtn.disabled = true;
shutterBtn.hidden = true;
if (currentEvent.isDemo) {
// En la demo el final del rollo es el momento de contarle qué sigue.
shotsLeftEl.textContent = 'Fin de la prueba';
setStatus('Así se siente. En tu evento cada invitado trae ' + PHOTO_LIMIT + ' fotos.');
} else {
shotsLeftEl.textContent = 'Se te acabó el rollo';
setStatus('Ya subiste tus ' + currentEvent.photoLimit + ' fotos. Todavía puedes dejar un mensaje de voz.');
}
revealRoll();
} else {
shotsLeftEl.textContent = left === 1 ? 'Te queda 1 foto' : 'Te quedan ' + left + ' fotos';
shutterBtn.disabled = false;
shutterBtn.hidden = false;
rollReview.hidden = true;
frameCard.hidden = false;
photoHint.hidden = false;
}
}

// --- 3) Identificar el evento a partir del link (?e=slug-del-evento) ---
let currentEvent = null; // { id, filterClass, photoLimit, isDemo }

async function loadEvent() {
const slug = new URLSearchParams(window.location.search).get('e');
if (!slug) {
showError('Este link no tiene un evento válido. Escanea el código QR de tu evento.');
return;
}

const { data, error } = await db.from('events').select('id, filter, status').eq('slug', slug).single();
if (error || !data) {
showError('No encontramos ese evento. Pide el código QR correcto a tu organizador.');
return;
}
if (data.status !== 'activo') {
showError('Este evento todavía no está activo.');
return;
}

currentEvent = {
id: data.id,
filterClass: 'filter-' + (data.filter || 'vintage'),
photoLimit: photoLimitFor(slug),
isDemo: slug === DEMO_SLUG
};

frameCard.classList.toggle('polaroid-card', currentEvent.filterClass === 'filter-polaroid');
document.getElementById('frame').classList.toggle('vintage-glow', currentEvent.filterClass === 'filter-vintage');

// si ya puso su nombre en una foto o mensaje anterior de esta visita, lo recordamos
try {
const savedName = localStorage.getItem('revelado_guest_name');
if (savedName) {
guestNameInput.value = savedName;
voiceGuestName.value = savedName;
}
} catch (e) { /* si el navegador bloquea localStorage, no pasa nada, solo no se recuerda */ }

stateScreen.hidden = true;
cameraUI.hidden = false;
refreshShotsUI();
}

// --- 4) Selector de modo: foto o mensaje de voz ---------------------
function setMode(mode) {
const isVoice = mode === 'voice';
photoMode.hidden = isVoice;
voiceMode.hidden = !isVoice;
modePhotoBtn.classList.toggle('active', !isVoice);
modeVoiceBtn.classList.toggle('active', isVoice);
setStatus('');
if (!isVoice) refreshShotsUI();
}
modePhotoBtn.addEventListener('click', () => setMode('photo'));
modeVoiceBtn.addEventListener('click', () => setMode('voice'));

// --- 5) Achicar la foto antes de subirla ---------------------------
function compress(file) {
return new Promise((resolve, reject) => {
const maxDim = 1200;
function draw(source, w, h) {
const scale = Math.min(1, maxDim / Math.max(w, h));
const canvas = document.createElement('canvas');
canvas.width = Math.round(w * scale);
canvas.height = Math.round(h * scale);
canvas.getContext('2d').drawImage(source, 0, 0, canvas.width, canvas.height);
canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('no blob')), 'image/jpeg', 0.7);
}
function fallback() {
const img = new Image();
const url = URL.createObjectURL(file);
img.onload = () => { draw(img, img.naturalWidth, img.naturalHeight); URL.revokeObjectURL(url); };
img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
img.src = url;
}
if (window.createImageBitmap) {
createImageBitmap(file, { imageOrientation: 'from-image' }).then(bmp => draw(bmp, bmp.width, bmp.height)).catch(fallback);
} else {
fallback();
}
});
}

// --- 6) El flujo de foto: foto -> vista previa + nombre/mensaje -> confirmar -> subir
let pendingBlob = null;

shutterBtn.addEventListener('click', () => {
if (currentEvent && shotsRemaining(currentEvent.id) === 0) { refreshShotsUI(); return; }
cameraInput.click();
});

cameraInput.addEventListener('change', async () => {
const file = cameraInput.files[0];
if (!file || !currentEvent) return;

setStatus('Revelando…');
shutterBtn.disabled = true;

try {
const blob = await compress(file);
pendingBlob = blob;

frame.innerHTML = '';
const img = document.createElement('img');
img.className = currentEvent.filterClass;
img.src = URL.createObjectURL(blob);
frame.appendChild(img);

setStatus('');
shutterBtn.hidden = true;
detailsPanel.hidden = false;
} catch (err) {
console.error(err);
setStatus('No se pudo procesar la foto: ' + (err.message || 'intenta de nuevo'), 'err');
shutterBtn.disabled = false;
} finally {
cameraInput.value = '';
}
});

// Aquí antes vivía el botón "Tomar otra". Se quitó a propósito: en una cámara
// desechable la foto que tomaste es la que se queda, y esa es justo la gracia
// del producto. Si se vuelve a necesitar, va aquí.

confirmUploadBtn.addEventListener('click', async () => {
if (!pendingBlob || !currentEvent) return;

const guestName = guestNameInput.value.trim();
const caption = captionInput.value.trim();

confirmUploadBtn.disabled = true;
confirmUploadBtn.textContent = 'Subiendo…';
setStatus('Revelando…');

try {
const path = currentEvent.id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';

const { error: uploadError } = await db.storage.from('fotos').upload(path, pendingBlob, { contentType: 'image/jpeg' });
if (uploadError) throw uploadError;

const { data: pub } = db.storage.from('fotos').getPublicUrl(path);

const { error: insertError } = await db.from('photos').insert({
event_id: currentEvent.id,
photo_url: pub.publicUrl,
guest_name: guestName || null,
caption: caption || null
});
if (insertError) throw insertError;

try { if (guestName) localStorage.setItem('revelado_guest_name', guestName); } catch (e) { /* ignorar */ }

registerShot(currentEvent.id);
// Nos guardamos la foto de esta visita para poder enseñarle su rollo al final.
rollPhotos.push(URL.createObjectURL(pendingBlob));

setStatus('¡Lista! Ya está en el álbum.', 'ok');
pendingBlob = null;
detailsPanel.hidden = true;
captionInput.value = '';
frame.innerHTML = '<div class="placeholder">Aquí aparecerá tu foto</div>';
} catch (err) {
console.error(err);
setStatus('No se pudo subir: ' + describeError(err), 'err');
} finally {
confirmUploadBtn.disabled = false;
confirmUploadBtn.textContent = 'Subir foto';
// refreshShotsUI decide si el obturador vuelve o no: si el rollo se acabó
// con esta foto, tiene que quedarse apagado.
refreshShotsUI();
}
});

// --- 7) El flujo de mensaje de voz: grabar (máx 15s) -> vista previa + nombre -> enviar
const MAX_MS = 15000;
let mediaRecorder = null;
let recordedChunks = [];
let recordedBlob = null;
let recordStartTime = 0;
let recordTimerInterval = null;
let recordStopTimeout = null;

function pickMimeType() {
const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
for (const c of candidates) {
if (MediaRecorder.isTypeSupported(c)) return c;
}
return '';
}

function extFor(mime) {
if (!mime) return 'webm';
if (mime.includes('mp4')) return 'm4a';
if (mime.includes('ogg')) return 'ogg';
return 'webm';
}

function formatTime(ms) {
const s = Math.min(15, Math.floor(ms / 1000));
return '0:' + String(s).padStart(2, '0');
}

function resetVoiceUI() {
recordedBlob = null;
voiceAudio.src = '';
voicePreview.hidden = true;
recordBtn.hidden = false;
recordBtn.classList.remove('recording');
recordTimer.hidden = true;
}

async function startRecording() {
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
setStatus('Tu navegador no permite grabar audio aquí.', 'err');
return;
}
try {
const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
const mimeType = pickMimeType();
mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
recordedChunks = [];

mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
mediaRecorder.onstop = () => {
stream.getTracks().forEach(t => t.stop());
clearInterval(recordTimerInterval);
clearTimeout(recordStopTimeout);
recordedBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || mimeType || 'audio/webm' });
voiceAudio.src = URL.createObjectURL(recordedBlob);
recordBtn.hidden = true;
recordBtn.classList.remove('recording');
recordTimer.hidden = true;
voicePreview.hidden = false;
};

mediaRecorder.start();
recordStartTime = Date.now();
recordBtn.classList.add('recording');
recordTimer.hidden = false;
recordTimer.textContent = '0:00 / 0:15';
recordTimerInterval = setInterval(() => {
recordTimer.textContent = formatTime(Date.now() - recordStartTime) + ' / 0:15';
}, 200);
recordStopTimeout = setTimeout(() => {
if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
}, MAX_MS);
} catch (err) {
console.error(err);
setStatus('No se pudo acceder al micrófono: ' + (err.message || 'revisa los permisos'), 'err');
}
}

recordBtn.addEventListener('click', () => {
if (mediaRecorder && mediaRecorder.state === 'recording') {
mediaRecorder.stop();
} else {
startRecording();
}
});

voiceRetakeBtn.addEventListener('click', resetVoiceUI);

voiceSendBtn.addEventListener('click', async () => {
if (!recordedBlob || !currentEvent) return;
const guestName = voiceGuestName.value.trim();

voiceSendBtn.disabled = true;
voiceRetakeBtn.disabled = true;
voiceSendBtn.textContent = 'Enviando…';
setStatus('Enviando mensaje…');

try {
const ext = extFor(recordedBlob.type);
const path = currentEvent.id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;

const { error: uploadError } = await db.storage.from('audios').upload(path, recordedBlob, { contentType: recordedBlob.type || 'audio/webm' });
if (uploadError) {
console.error('uploadError', uploadError);
setStatus('No se pudo SUBIR el audio: ' + describeError(uploadError), 'err');
return;
}

const { data: pub } = db.storage.from('audios').getPublicUrl(path);

const { error: insertError } = await db.from('voice_messages').insert({
event_id: currentEvent.id,
audio_url: pub.publicUrl,
guest_name: guestName || null
});
if (insertError) {
console.error('insertError', insertError);
setStatus('No se pudo GUARDAR el mensaje: ' + describeError(insertError), 'err');
return;
}

try { if (guestName) localStorage.setItem('revelado_guest_name', guestName); } catch (e) { /* ignorar */ }

setStatus('¡Mensaje enviado! Gracias 💛', 'ok');
resetVoiceUI();
} catch (err) {
console.error(err);
setStatus('No se pudo enviar: ' + describeError(err), 'err');
} finally {
voiceSendBtn.disabled = false;
voiceRetakeBtn.disabled = false;
voiceSendBtn.textContent = 'Enviar mensaje';
}
});

loadEvent();
</script>
