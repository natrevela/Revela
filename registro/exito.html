<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revelado — Pago recibido</title>
  <style>
    :root{
      --darkroom:#150f0a; --darkroom-2:#221a12;
      --paper:#f3e9d7; --paper-dim:#c2b498;
      --amber:#e8823c; --amber-bright:#ffa858; --fixer:#4fa69c;
      --line-strong:rgba(243,233,215,0.26); --shadow:0 14px 30px -16px rgba(0,0,0,0.7);
    }
    *,*::before,*::after{box-sizing:border-box;}
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:var(--darkroom); color:var(--paper); font-family:system-ui, sans-serif; padding:24px;
    }
    .card{
      background:var(--darkroom-2); border:1px solid var(--line-strong); border-radius:16px;
      padding:32px 28px; max-width:400px; width:100%; text-align:center; box-shadow:var(--shadow);
    }
    .check{
      width:52px; height:52px; border-radius:50%; background:rgba(79,166,156,0.14); color:var(--fixer);
      display:flex; align-items:center; justify-content:center; margin:0 auto 18px; font-size:24px;
    }
    h1{font-size:1.4rem; margin:0 0 10px;}
    p{color:var(--paper-dim); font-size:13.5px; line-height:1.6; margin:0 0 24px;}
    a.btn{
      display:inline-flex; font-family:inherit; font-size:15px; font-weight:600; text-decoration:none;
      border-radius:999px; padding:13px 26px; background:var(--amber); color:var(--darkroom);
    }
    a.btn:hover{background:var(--amber-bright);}
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>¡Pago recibido!</h1>
    <p>Tu evento se está activando — puede tardar unos segundos. Inicia sesión para ver tu álbum y tu código QR.</p>
    <a class="btn" href="/organizador/">Ir a mi álbum</a>
  </div>
</body>
</html>
