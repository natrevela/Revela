<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revelado — Álbum</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --darkroom:#150f0a; --darkroom-2:#221a12; --darkroom-3:#2c2117;
      --paper:#f3e9d7; --paper-dim:#c2b498; --paper-faint:#8a7d65;
      --amber:#e8823c; --fixer:#4fa69c;
      --line:rgba(243,233,215,0.14); --line-strong:rgba(243,233,215,0.26);
      --shadow:0 14px 30px -16px rgba(0,0,0,0.7);
    }
    *,*::before,*::after{box-sizing:border-box;}
    body{
      margin:0; min-height:100vh; background:var(--darkroom); color:var(--paper);
      font-family:system-ui, sans-serif; padding:28px 20px 60px;
    }
    .wrap{max-width:960px; margin:0 auto;}
    header{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:8px;}
    h1{font-size:1.6rem; margin:0;}
    .count{font-family:ui-monospace, monospace; color:var(--paper-dim); font-size:0.9rem;}
    .count strong{color:var(--paper);}
    .format-badge{
      display:inline-block; margin-bottom:22px; font-size:11.5px; letter-spacing:0.04em; text-transform:uppercase;
      color:var(--fixer); border:1px solid rgba(79,166,156,0.4); background:rgba(79,166,156,0.08);
      padding:4px 10px; border-radius:999px;
    }

    .empty{border:1px dashed var(--line-strong); border-radius:12px; padding:34px 20px; text-align:center; color:var(--paper-faint); font-size:14px;}
    .err{border:1px solid rgba(217,105,79,0.5); background:var(--darkroom-2); color:#f0b6a5; border-radius:10px; padding:12px 15px; font-size:13.5px; margin-bottom:18px;}

    .grid{display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));}
    .print{background:var(--paper); border-radius:3px; padding:8px 8px 22px; box-shadow:var(--shadow);}
    .print:nth-child(3n+1){transform:rotate(-1.6deg);}
    .print:nth-child(3n+2){transform:rotate(1.2deg);}
    .print:nth-child(3n){transform:rotate(-0.6deg);}
    .print .ts{font-size:9px; color:var(--darkroom); opacity:0.55; margin-top:6px; text-align:center; font-family:ui-monospace, monospace;}
    .shot{position:relative; display:block; overflow:hidden; border-radius:2px;}
    .print img{width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:2px; display:block;}

    /* El formato "polaroid" usa un marco más blanco y con más aire abajo -- la franja clásica. */
    .print.polaroid-card{background:#ffffff; padding:14px 14px 46px;}

    /* --- Los tres formatos, iguales a los de la página de la cámara --- */
    /* vintage: foto vieja, desvanecida por el sol -- poco contraste, poca saturación, luces quemadas */
    .filter-vintage{ filter: sepia(0.18) saturate(0.8) contrast(0.78) brightness(1.16) hue-rotate(-4deg); }
    /* blanco y negro: mucho contraste real, sombras profundas, no solo "sin color" */
    .filter-bw{ filter: grayscale(1) contrast(1.32) brightness(0.94); }
    .filter-polaroid{ filter: saturate(0.85) contrast(0.92) brightness(1.06) sepia(0.08); }

    /* el brillo cálido de luz que trae el formato vintage, encima del filtro de color */
    .shot.vintage-glow::after{
      content:""; position:absolute; inset:0; pointer-events:none;
      background:radial-gradient(circle at 72% 18%, rgba(255,221,163,0.42), transparent 55%);
      mix-blend-mode:screen;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Álbum en vivo</h1>
      <div class="count" id="count">cargando…</div>
    </header>
    <div class="format-badge" id="formatBadge" hidden></div>
    <div id="content"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://qhwxtgzqnztshmudabho.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFod3h0Z3pxbnp0c2htdWRhYmhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3OTI5NzQsImV4cCI6MjEwMzM2ODk3NH0.ufpYauUWbbbJrAPOTY3zA6vQ9DfsYBEFXVsZrtPV2YU';
    const EVENT_NAME = 'Mi evento';

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const countEl = document.getElementById('count');
    const contentEl = document.getElementById('content');
    const badgeEl = document.getElementById('formatBadge');

    const FILTER_LABELS = {
      vintage: 'Formato: película vintage',
      bw: 'Formato: blanco y negro',
      polaroid: 'Formato: polaroid suave'
    };

    function esc(s){
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function fmtTime(iso){
      try {
        return new Date(iso).toLocaleString('es-MX', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
      } catch (e) { return ''; }
    }

    function render(photos, filterKey) {
      countEl.innerHTML = '<strong>' + photos.length + '</strong> foto' + (photos.length === 1 ? '' : 's');
      if (photos.length === 0) {
        contentEl.innerHTML = '<div class="empty">Aún no hay fotos. En cuanto alguien use la cámara, van a aparecer aquí solas.</div>';
        return;
      }
      const printClass = 'print' + (filterKey === 'polaroid' ? ' polaroid-card' : '');
      const shotClass = 'shot' + (filterKey === 'vintage' ? ' vintage-glow' : '');
      contentEl.innerHTML = '<div class="grid">' + photos.map(p =>
        '<div class="' + printClass + '"><span class="' + shotClass + '"><img class="filter-' + esc(filterKey) + '" src="' + esc(p.photo_url) + '" alt="Foto del álbum" loading="lazy"></span>' +
        '<div class="ts">' + esc(fmtTime(p.created_at)) + '</div></div>'
      ).join('') + '</div>';
    }

    async function load() {
      const [eventRes, photosRes] = await Promise.all([
        db.from('events').select('filter').eq('name', EVENT_NAME).single(),
        db.from('photos').select('*').eq('event_name', EVENT_NAME).order('created_at', { ascending: false })
      ]);

      if (photosRes.error) {
        contentEl.innerHTML = '<div class="err">No se pudo cargar el álbum: ' + esc(photosRes.error.message) + '</div>';
        countEl.textContent = '';
        return;
      }

      const filterKey = (!eventRes.error && eventRes.data && eventRes.data.filter) ? eventRes.data.filter : 'vintage';
      badgeEl.textContent = FILTER_LABELS[filterKey] || FILTER_LABELS.vintage;
      badgeEl.hidden = false;

      render(photosRes.data, filterKey);
    }

    load();
    // Cada 6 segundos revisa fotos nuevas Y si el formato del evento cambió.
    setInterval(load, 6000);
  </script>
</body>
</html>
